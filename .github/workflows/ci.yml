name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Use Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: '18.x'

    - name: Install dependencies
      run: npm ci

    - name: Audit dependencies
      run: npm audit --audit-level=critical

    - name: Build
      run: npm run build

    - name: Run tests
      run: npm test -- --passWithNoTests --coverage --watchAll=false --coverageReporters=json-summary --coverageReporters=cobertura

    - name: Extract coverage percentage
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      id: coverage
      run: |
        COVERAGE=$(node -e "const c = require('./coverage/coverage-summary.json'); console.log(c.total.statements.pct)")
        echo "percentage=$COVERAGE" >> $GITHUB_OUTPUT

    - name: Update coverage badge
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      continue-on-error: true
      uses: schneegans/dynamic-badges-action@e9a478b16159b4d31420099ba146cdc50f134483 # v1.7.0
      with:
        auth: ${{ secrets.GIST_SECRET }}
        gistID: REPLACE_WITH_YOUR_GIST_ID
        filename: coverage-badge.json
        label: coverage
        message: ${{ steps.coverage.outputs.percentage }}%
        valColorRange: ${{ steps.coverage.outputs.percentage }}
        minColorRange: 50
        maxColorRange: 90
        namedLogo: jest

    - name: Generate coverage report
      if: github.event_name == 'pull_request'
      uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
      with:
        filename: coverage/cobertura-coverage.xml
        badge: true
        format: markdown
        output: both
        thresholds: '60 80'

    - name: Post coverage comment on PR
      if: github.event_name == 'pull_request'
      uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
      with:
        recreate: true
        path: code-coverage-results.md
