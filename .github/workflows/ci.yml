name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Use Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: '18.x'

    - name: Install dependencies
      run: npm ci

    - name: Audit production dependencies
      run: npm audit --audit-level=critical --omit=dev

    - name: Build
      run: npm run build

    - name: Run tests
      run: npm test -- --passWithNoTests --coverage --watchAll=false --coverageReporters=json-summary --coverageReporters=cobertura

    # Coverage badge step removed — requires a manually-created gist.
    # To restore: create a gist, add its ID below, and set GIST_SECRET.
    # See: https://github.com/Schneegans/dynamic-badges-action

    - name: Generate coverage report
      if: github.event_name == 'pull_request'
      uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
      with:
        filename: coverage/cobertura-coverage.xml
        badge: true
        format: markdown
        output: both
        thresholds: '60 80'

    - name: Post coverage comment on PR
      if: github.event_name == 'pull_request'
      uses: marocchino/sticky-pull-request-comment@322a2451dae6c7831d1a8b931275a7f78147c888 # v2.1.0
      with:
        recreate: true
        path: code-coverage-results.md

    - name: VisionSim dogfood
      if: github.event_name == 'pull_request'
      uses: ./
      with:
        images: 'public/images/garden.png'
        conditions: 'protanopia,deuteranopia,tritanopia,glaucoma,cataracts'
        github-token: ${{ secrets.GITHUB_TOKEN }}
